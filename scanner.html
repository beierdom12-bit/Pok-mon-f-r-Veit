    <script>
        const cameraInput = document.getElementById('camera-input');
        const galleryInput = document.getElementById('gallery-input');
        const actionArea = document.getElementById('action-area');
        const progressBox = document.getElementById('progress-box');
        const resultContainer = document.getElementById('result-container');
        
        let scannedCardData = null;

        async function sendToBackend(file) {
            if (!file) return;

            actionArea.style.display = 'none';
            progressBox.style.display = 'block';

            const formData = new FormData();
            formData.append('image', file);

            try {
                const response = await fetch('http://127.0.0.1:5000/scan', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();
                progressBox.style.display = 'none';

                if (data.success && data.match_found && data.card) {
                    scannedCardData = data.card;
                    document.getElementById('card-title').textContent = `#${data.card.localId} ${data.card.name}`;
                    document.getElementById('card-set').textContent = `Set: ${data.card.set}`;
                    
                    // Bild-URL direkt setzen mit Fallback
                    const imgUrl = data.card.image ? `${data.card.image}/high.webp` : '';
                    document.getElementById('card-img').src = imgUrl;
                    
                    resultContainer.style.display = 'flex';
                } else {
                    alert("Karte erkannt, aber keine Bild-Daten von der API erhalten.");
                    actionArea.style.display = 'grid';
                }

            } catch (err) {
                progressBox.style.display = 'none';
                actionArea.style.display = 'grid';
                alert("Verbindung zum Python-Server fehlgeschlagen!");
            }
        }

        cameraInput.addEventListener('change', (e) => sendToBackend(e.target.files[0]));
        galleryInput.addEventListener('change', (e) => sendToBackend(e.target.files[0]));

        document.getElementById('btn-save').addEventListener('click', () => {
            if (!scannedCardData) return;
            const key = `collection_scanned`;
            const collection = JSON.parse(localStorage.getItem(key) || '{}');
            collection[scannedCardData.name] = { normal: 1, name: scannedCardData.name };
            localStorage.setItem(key, JSON.stringify(collection));

            const btn = document.getElementById('btn-save');
            btn.textContent = "✅ In Sammlung gespeichert!";
            setTimeout(() => { btn.textContent = "💾 In Sammlung speichern"; }, 2000);
        });

        document.getElementById('btn-reset').addEventListener('click', () => {
            cameraInput.value = '';
            galleryInput.value = '';
            resultContainer.style.display = 'none';
            actionArea.style.display = 'grid';
        });
    </script>
